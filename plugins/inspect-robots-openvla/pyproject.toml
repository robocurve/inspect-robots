[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-openvla"
version = "0.1.0"
description = "OpenVLA policy adapter for Inspect Robots — evaluate openvla/openvla-7b against any compatible embodiment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Inspect Robots contributors" }]
keywords = ["robotics", "openvla", "vla", "policy-adapter", "inspect_robots", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core deps stay CPU-friendly: numpy + Pillow only. torch / transformers live in
# the `openvla` extra so `inspect-robots list policies` and compatibility checks
# work on a machine that never downloads the 7B checkpoint.
dependencies = [
    "inspect-robots>=0.2",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
openvla = [
    "torch>=2.2",
    "transformers==4.40.1",
    "timm>=0.9.10",
    "accelerate>=0.30",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

# Entry-point discovery: an installed inspect-robots-openvla appears in
# `inspect-robots list policies` without being imported first. The registry calls
# this factory by the name `openvla_local` — `openvla` is already registered by
# inspect-robots-widowx (a REST client for OpenVLA's `/act` server), and two
# distributions cannot own the same entry-point name.
[project.entry-points."inspect_robots.policies"]
openvla_local = "inspect_robots_openvla:openvla_policy"

[project.urls]
Homepage = "https://github.com/robocurve/inspect-robots/tree/main/plugins/inspect-robots-openvla"
Repository = "https://github.com/robocurve/inspect-robots"

# In the Inspect Robots monorepo this resolves the `inspect_robots` dependency to the
# in-repo core package instead of PyPI. Harmless in a standalone checkout (uv
# ignores a workspace source when there is no workspace root).
[tool.uv.sources]
inspect-robots = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_openvla"]

[tool.hatch.build.targets.sdist]
include = ["src/inspect_robots_openvla", "tests", "README.md"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots", "inspect_robots_openvla"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
strict = true

# torch / transformers ship no complete inline typing; the adapter touches them
# only through `Any`-typed handles.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "timm.*", "accelerate.*"]
ignore_missing_imports = true
